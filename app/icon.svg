<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>LESS</title>
  <!--
    The mark: a Courier L. Slab serifs, typewriter weight, drawn as plain rects
    so it needs no font and stays crisp at 16px, which is the only size that
    really matters in a tab.

    The tile inverts with the viewer's theme. A browser's tab strip is light in
    light mode and near-black in dark mode, so a fixed ink tile would dissolve
    into a dark strip and leave the L floating. Inverting keeps a solid,
    intentional-looking tile against either. Browsers that ignore the media
    query fall back to the light treatment, which is the correct default.
    Colours are the app's own ink and paper tokens from app/tokens.css.
    (Keep this comment free of double hyphens: they are illegal in XML
    comments and silently turn the icon into a broken image.)
  -->
  <style>
    .tile { fill: #17171a; }
    .glyph { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f4f4f2; }
      .glyph { fill: #17171a; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <!-- Optically centred: the glyph's own bounding box is 19..45.5 x 16.5..47.5,
       so its centre lands on the tile's centre rather than sitting high and right. -->
  <g class="glyph">
    <rect x="19" y="16.5" width="16" height="5" />
    <rect x="24.5" y="16.5" width="7" height="31" />
    <rect x="24.5" y="42.5" width="21" height="5" />
    <rect x="40.5" y="36.5" width="5" height="11" />
  </g>
</svg>
