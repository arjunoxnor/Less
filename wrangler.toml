# Cloudflare Pages config for LESS. The static site builds to out/ (Next export)
# and the API lives in functions/. D1 is the database that replaced Supabase.
name = "less"
pages_build_output_dir = "out"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "less-db"
database_id = "ec14ff01-64ae-48e0-b176-0ffa0bf596e9"

# Durable rate-limit counters for the abuse-sensitive auth endpoints. KV is
# eventually consistent, which is fine for a limiter (best-effort counting,
# but it survives isolate restarts, unlike an in-memory Map).
[[kv_namespaces]]
binding = "RATE"
id = "cae29f4f420b4947bd26888a5ed857d8"

# Uploaded images (boards: references, storyboards, palettes), keyed by an
# unguessable asset id. The rules for what may be stored are in
# lib/server/assets.ts. KV rather than R2 because R2 is not enabled on this
# account; the API only needs get/put/delete, so the store can be swapped later.
[[kv_namespaces]]
binding = "IMAGES"
id = "56f5a9c08dac40e591e264bf379c983c"
