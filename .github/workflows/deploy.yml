name: Deploy to Cloudflare Pages

# On every push to main, build the static site (out/) and ship it, together with
# the API in functions/, to the Cloudflare Pages project "less" (served at
# https://less.oxnorhub.com). Bindings (the D1 database) come from wrangler.toml;
# the SESSION_SECRET is a Pages project secret set once with `wrangler pages
# secret put`. There are no Supabase keys anymore.
#
# One-time setup: a Pages project named "less" with the custom domain, the D1
# database "less-db", the SESSION_SECRET secret, and repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The gate runs BEFORE the deploy, so a red typecheck or a failing test
      # stops the push from reaching less.oxnorhub.com. This used to build and
      # ship whatever was pushed, which is how a broken pagination build once
      # reached production.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the static site
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build

      # Pinned to a major version. `wrangler@latest` meant a breaking release on
      # Cloudflare's side could break deploys on a push that changed nothing.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
