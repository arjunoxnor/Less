name: Deploy to Cloudflare Pages

# On every push to main, build the static site and ship it to the Cloudflare
# Pages project "less" (served at https://less.oxnorhub.com). The NEXT_PUBLIC
# Supabase values are PUBLIC (the anon key is meant for the browser, protected
# by row-level security) but are kept as repo secrets so they are not in the
# source; they are baked into the static bundle at build time.
#
# One-time setup: a Pages project named "less" with the custom domain, plus
# repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy out --project-name=less --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
